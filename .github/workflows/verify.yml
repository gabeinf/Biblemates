# Runs `pnpm verify` on every PR, hourly on master, and on pushes to master; uploads screenshots.
# PRs merge via auto-merge as github-actions, and GitHub does NOT fire push workflows for those
# merges (confirmed 2026-11-19). The hourly run is the safety net that catches two green PRs
# that break each other; the push trigger covers manual merges.
# The job is named `verify`: make it a required check in branch protection.
name: verify

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *' # runs on the default branch (master)
  workflow_dispatch: # scripts/queue.mjs dispatches this when master has merges no run has verified

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: pnpm verify
        run: pnpm verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
